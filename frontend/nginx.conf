# OpsAgent 前端 nginx 配置（容器内）
# 静态托管 dist，/api 反代到 backend 容器（与 Vite 代理行为一致，保留 /api 前缀）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理（后端容器名 backend，保留 /api 前缀）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SSE 流式必需：关闭缓冲 + 长连接超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Connection "";
    }
}
